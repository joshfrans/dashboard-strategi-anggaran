name: Daily Dashboard Backup

on:
  schedule:
    # Runs every day at 18:00 UTC / 01:00 WIB.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  # contents: write dibutuhkan untuk membuat Release arsip backup.
  # Workflow ini tidak pernah push ke branch mana pun.
  contents: write
  actions: read

env:
  DASHBOARD_NAME: dashboard-strategi-evaluasi
  GDRIVE_FOLDER_ID: 1qTohLBmsuVdBO0UNKwgm4tq2uzMamQ5k
  STRATEGY_SHEET_ID: 15T2dQA_96m71Z2D9k-YZh0ehkZsxZMS5
  HAS_GDRIVE_SECRET: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON != '' }}

jobs:
  full-backup:
    name: Full Dashboard Backup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare backup metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          STAMP="$(TZ=Asia/Jakarta date +'%Y%m%d-%H%M%S')"
          echo "stamp=${STAMP}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${DASHBOARD_NAME}-backup-${STAMP}.zip" >> "$GITHUB_OUTPUT"
          echo "backup_time=$(TZ=Asia/Jakarta date +'%d %B %Y %H:%M:%S WIB')" >> "$GITHUB_OUTPUT"
          echo "month_tag=backup-$(TZ=Asia/Jakarta date +'%Y%m')" >> "$GITHUB_OUTPUT"
          echo "month_label=$(TZ=Asia/Jakarta date +'%B %Y')" >> "$GITHUB_OUTPUT"

      - name: Capture online data sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup-data-sources
          curl -L --fail --retry 3 \
            "https://docs.google.com/spreadsheets/d/${STRATEGY_SHEET_ID}/export?format=xlsx" \
            -o "backup-data-sources/strategi-evaluasi-google-source.xlsx" || true
          cat > backup-data-sources/BACKUP_INFO.txt <<EOF
          Backup dashboard: ${DASHBOARD_NAME}
          Waktu backup: ${{ steps.meta.outputs.backup_time }}
          Repository: ${{ github.repository }}
          Commit: ${{ github.sha }}
          Data source Strategi & Evaluasi: Google Sheets ${STRATEGY_SHEET_ID}
          Catatan: Jika file Google Sheets tidak dapat diunduh, backup repository tetap dibuat.
          EOF

      - name: Create full backup ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -r "${{ steps.meta.outputs.zip_name }}" . \
            -x ".git/*" \
            -x "${{ steps.meta.outputs.zip_name }}" \
            -x "node_modules/*"
          ls -lh "${{ steps.meta.outputs.zip_name }}"

      - name: Store backup as GitHub artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.meta.outputs.zip_name }}
          path: ${{ steps.meta.outputs.zip_name }}
          retention-days: 90

      # GitHub Artifact hangus setelah 90 hari. Release tidak punya masa
      # kedaluwarsa, jadi dipakai sebagai arsip jangka panjang:
      #   backup-latest  -> selalu ditimpa ZIP paling baru
      #   backup-YYYYMM  -> dibuat sekali per bulan sebagai arsip permanen
      - name: Publish rolling latest backup release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES="Backup otomatis terbaru.

          Waktu backup: ${{ steps.meta.outputs.backup_time }}
          Commit: ${{ github.sha }}

          Release ini ditimpa setiap kali backup harian berjalan.
          Untuk arsip yang tidak berubah, lihat release backup-YYYYMM."
          if gh release view backup-latest >/dev/null 2>&1; then
            gh release edit backup-latest --notes "${NOTES}"
            # Hapus aset lama agar hanya ZIP terbaru yang tersimpan.
            gh release view backup-latest --json assets \
              --jq '.assets[].name' | while read -r asset; do
                [ -n "${asset}" ] && gh release delete-asset backup-latest "${asset}" --yes
              done
          else
            gh release create backup-latest \
              --title "Backup terbaru" \
              --notes "${NOTES}" \
              --latest
          fi
          gh release upload backup-latest "${{ steps.meta.outputs.zip_name }}" --clobber

      - name: Publish monthly archive release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.month_tag }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Arsip bulanan ${TAG} sudah ada; tidak ada yang perlu dibuat."
            exit 0
          fi
          gh release create "${TAG}" \
            --title "Arsip backup ${{ steps.meta.outputs.month_label }}" \
            --notes "Arsip backup bulanan yang tidak ditimpa.

          Waktu backup: ${{ steps.meta.outputs.backup_time }}
          Commit: ${{ github.sha }}" \
            --latest=false
          gh release upload "${TAG}" "${{ steps.meta.outputs.zip_name }}" --clobber

      - name: Upload backup to Google Drive
        if: ${{ env.HAS_GDRIVE_SECRET == 'true' }}
        shell: bash
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone
          SERVICE_ACCOUNT_FILE="${RUNNER_TEMP}/gdrive-service-account.json"
          printf '%s' "${GDRIVE_SERVICE_ACCOUNT_JSON}" > "${SERVICE_ACCOUNT_FILE}"
          rclone config create dashboard_backup_drive drive \
            scope drive \
            service_account_file "${SERVICE_ACCOUNT_FILE}" \
            root_folder_id "${GDRIVE_FOLDER_ID}"
          rclone copy "${{ steps.meta.outputs.zip_name }}" dashboard_backup_drive: --progress
          rclone lsf dashboard_backup_drive: | tail -n 20

      - name: Google Drive setup notice
        if: ${{ env.HAS_GDRIVE_SECRET != 'true' }}
        shell: bash
        run: |
          echo "Backup ZIP sudah tersimpan sebagai GitHub Artifact."
          echo "Untuk upload otomatis ke Google Drive, tambahkan secret GDRIVE_SERVICE_ACCOUNT_JSON dan share folder Drive ke email service account."
