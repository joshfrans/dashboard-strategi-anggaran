name: Daily Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Runs every day at 20:00 UTC / 03:00 WIB.
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  static-security-check:
    name: Static Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan public files for data leaks
        run: node tools/data-leak-scan.mjs

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  daily-dast-baseline:
    name: Daily DAST Baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Baseline scan against GitHub Pages
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "https://joshfrans.github.io/dashboard-strategi-anggaran/"
          fail_action: true
          allow_issue_writing: false
          artifact_name: "zap-baseline-report"
          rules_file_name: ".zap/rules.tsv"
